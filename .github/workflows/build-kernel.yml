name: Build Kernel

on:
  workflow_dispatch:
    # GitHub allows at most 10 workflow_dispatch inputs, so these are the knobs
    # worth changing per-run. Everything else lives in the config file selected
    # by `config`, so a fork can keep one profile per device.
    inputs:
      config:
        description: "Config file to build (path, relative to the repo root)"
        required: false
        default: "config.env"
        type: string
      # "config" on the options below means "use whatever the config file says".
      # It is the default so that running the form without touching anything
      # reproduces exactly what your profile describes.
      ksu_variant:
        description: "KernelSU variant"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - none
          - kernelsu
          - kernelsu-next
          - sukisu-ultra
          - resukisu
          - rsuntk
          - backslashxx
      ksu_ref:
        description: "KernelSU branch/tag/commit (blank = best default for your kernel)"
        required: false
        default: ""
        type: string
      hook_mode:
        description: "Syscall hook mechanism"
        required: false
        default: "config"
        type: choice
        options: [config, auto, kprobes, manual, tracepoint, syscall, none]
      susfs:
        description: "Apply SUSFS (mount/root hiding)"
        required: false
        default: "config"
        type: choice
        options: [config, "true", "false"]
      path_umount:
        description: "Backport path_umount() (needed on kernels older than 5.9)"
        required: false
        default: "config"
        type: choice
        options: [config, "true", "false"]
      hide_stuff:
        description: "Apply hide_stuff (extra fingerprint removal)"
        required: false
        default: "config"
        type: choice
        options: [config, "true", "false"]
      kpm:
        description: "Enable KPM (SukiSU-Ultra only)"
        required: false
        default: "config"
        type: choice
        options: [config, "true", "false"]
      extra_defconfig:
        description: "Extra defconfig lines, space separated (e.g. CONFIG_TMPFS_XATTR=y)"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Publish the build as a GitHub Release"
        required: false
        default: false
        type: boolean

  workflow_call:
    inputs:
      config:          { required: false, default: "config.env", type: string }
      ksu_variant:     { required: false, default: "config",     type: string }
      ksu_ref:         { required: false, default: "",           type: string }
      hook_mode:       { required: false, default: "config",     type: string }
      susfs:           { required: false, default: "config",     type: string }
      path_umount:     { required: false, default: "config",     type: string }
      hide_stuff:      { required: false, default: "config",     type: string }
      kpm:             { required: false, default: "config",     type: string }
      extra_defconfig: { required: false, default: "",           type: string }
      publish_release: { required: false, default: false,        type: boolean }

# Only one build per ref at a time; a newer run supersedes an older one.
concurrency:
  group: build-kernel-${{ github.ref }}-${{ inputs.config }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.config }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      device: ${{ steps.meta.outputs.device }}
      build_time: ${{ steps.meta.outputs.build_time }}
      ksu_name: ${{ steps.meta.outputs.ksu_name }}
      ksu_version: ${{ steps.meta.outputs.ksu_version }}
      kernel_release: ${{ steps.meta.outputs.kernel_release }}
      susfs_version: ${{ steps.meta.outputs.susfs_version }}
    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      CONFIG_ENV: ${{ inputs.config }}
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

      # workflow inputs -> IN_* overrides consumed by scripts/config.sh
      IN_KSU_VARIANT: ${{ inputs.ksu_variant }}
      IN_KSU_REF: ${{ inputs.ksu_ref }}
      IN_KSU_HOOK_MODE: ${{ inputs.hook_mode }}
      IN_ENABLE_SUSFS: ${{ inputs.susfs }}
      IN_ENABLE_PATH_UMOUNT: ${{ inputs.path_umount }}
      IN_ENABLE_HIDE_STUFF: ${{ inputs.hide_stuff }}
      IN_ENABLE_KPM: ${{ inputs.kpm }}
      IN_EXTRA_DEFCONFIG: ${{ inputs.extra_defconfig }}

    steps:
      - uses: actions/checkout@v4

      - name: Harden config for runner limits
        run: |
          echo "##################################################"
          echo "WORKFLOW_REV: v17-upload-symvers"
          echo "##################################################"
          # runner 只有 7GB RAM / 14GB 磁盘，MTK 全量树按默认配置必然爆。
          # 在这里直接改，避免还要单独上传 config.env。
          # 先删后追加：原文件里这一行可能压根不存在，sed 替换会静默跳过
          sed -i '/^ENABLE_CCACHE=/d' config.env
          echo 'ENABLE_CCACHE=false' >> config.env
          sed -i '/^EXTRA_DEFCONFIG=/d' config.env
          echo 'EXTRA_DEFCONFIG=CONFIG_WERROR=n' >> config.env
          # 原厂 .config 含 CONFIG_LTO_CLANG_FULL=y 与 CONFIG_CFI_CLANG=y。
          # CFI 依赖 LTO，关掉 LTO 会连带关掉 CFI，导致 __cfi_slowpath 符号消失，
          # 225 个 vendor 模块中有 115 个依赖该符号。必须保持 LTO 开启。
          sed -i '/^DISABLE_LTO=/d' config.env
          echo 'DISABLE_LTO=false' >> config.env
          echo "--- 生效配置 ---"
          grep -E '^(ENABLE_CCACHE|EXTRA_DEFCONFIG|DISABLE_LTO|KSU_VARIANT|DISABLE_CC_WERROR)=' config.env || true

      - name: Resolve configuration
        run: bash scripts/config.sh

      - name: Free up disk space
        if: env.REMOVE_UNUSED_PACKAGES == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Add swap space
        run: |
          # LTO links are memory-hungry and the runner has 16GB; a swap file is
          # cheaper and more predictable than an unpinned third-party action.
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          # Kept deliberately lean. The historical list here was copied from the
          # full AOSP platform build docs and pulled in ~40 packages a kernel
          # build never touches, several of which no longer exist on current
          # Ubuntu (python2, lib32ncurses5-dev, ...).
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex \
            git libelf-dev libssl-dev lz4 make python3 rsync unzip zip zstd \
            libncurses-dev
          mkdir -p "$WORKSPACE"

      - name: Set up toolchain
        run: bash scripts/toolchain.sh

      - name: Fetch kernel source
        run: bash scripts/source.sh

      - name: Generate matisse defconfig
        run: |
          set -euo pipefail
          cd "$WORKSPACE/android-kernel"
          export PATH="$WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          echo "clang: $(command -v clang)"
          clang --version | head -1
          # 先跑一次 gki_defconfig，把 scripts/kconfig 的 host 工具编出来
          make -s gki_defconfig
          # 照抄 build.config.xiaomi.common 的 PRE_DEFCONFIG_CMDS
          KCONFIG_CONFIG=arch/arm64/configs/vendor/matisse_gki_defconfig \
          scripts/kconfig/merge_config.sh -m -r \
            arch/arm64/configs/gki_defconfig \
            arch/arm64/configs/vendor/xiaomi_mt6983.config \
            arch/arm64/configs/vendor/matisse.config
          # 该驱动引用了树里未定义的 VFF_AG_SUPPORT，且手机日常用不到（仅调试串口）
          echo '# CONFIG_MTK_UART_APDMA is not set' >> arch/arm64/configs/vendor/matisse_gki_defconfig
          echo '# CONFIG_WERROR is not set' >> arch/arm64/configs/vendor/matisse_gki_defconfig
          echo 'CONFIG_FRAME_WARN=0' >> arch/arm64/configs/vendor/matisse_gki_defconfig
          # 原厂 CONFIG_TRIM_UNUSED_KSYMS=y，但那是伴随 vendor 模块一起构建时的行为。
          # 我们把所有 =m 关掉后内核不编任何模块，TRIM 会把全部 EXPORT_SYMBOL
          # 判定为"未被引用"并整体裁掉，导致 225 个 vendor 模块加载时 unknown symbol。
          # 必须关闭，让导出符号完整保留。
          echo '# CONFIG_TRIM_UNUSED_KSYMS is not set' >> arch/arm64/configs/vendor/matisse_gki_defconfig
          # trusted_mem 原厂是模块（vendor_dlkm 里有 trusted_mem.ko），
          # 本树合并后变成 =y 编进内核，而 entry.c 引用了树里未定义的
          # FREE_SESSION_HANDLE / session，是 WIP 未完成代码。按原厂形态关掉。
          echo '# CONFIG_MTK_TRUSTED_MEMORY_SUBSYSTEM is not set' >> arch/arm64/configs/vendor/matisse_gki_defconfig
          echo '# CONFIG_TEST_MTK_TRUSTED_MEMORY is not set' >> arch/arm64/configs/vendor/matisse_gki_defconfig
          echo '# CONFIG_TMEM_MEMORY_POOL_ALLOCATOR is not set' >> arch/arm64/configs/vendor/matisse_gki_defconfig
          # 原厂 /proc/config.gz 里 =m 数量为 0：内核 Image 只含 built-in，
          # 225 个 vendor 模块由另一套配置单独编译、已存在于 vendor_dlkm。
          # 本树 matisse.config 把 panel/触摸/音频/指纹都标成 =m，编它们纯属浪费
          # （Full LTO 下尤其致命），全部关成 not set。CONFIG_MODULES 本身保持 =y。
          BEFORE_M=$(grep -c '=m$' arch/arm64/configs/vendor/matisse_gki_defconfig || true)
          sed -i -E 's/^(CONFIG_[A-Za-z0-9_]+)=m$/\# \1 is not set/' arch/arm64/configs/vendor/matisse_gki_defconfig
          AFTER_M=$(grep -c '=m$' arch/arm64/configs/vendor/matisse_gki_defconfig || true)
          echo "modules: =m $BEFORE_M -> $AFTER_M"
          grep -c 'is not set' arch/arm64/configs/vendor/matisse_gki_defconfig || true
          echo "merged defconfig: $(wc -l < arch/arm64/configs/vendor/matisse_gki_defconfig) lines"
          # build.sh 用 O=out 做树外编译，源码树里残留 .config / include/generated
          # 会被判定为 "source tree is not clean" 而直接失败，必须清干净。
          # mrproper 不会删除 arch/arm64/configs/ 下我们自己生成的 defconfig。
          make -s mrproper
          test -f arch/arm64/configs/vendor/matisse_gki_defconfig \
            && echo "defconfig survived mrproper"
          test ! -f .config && echo "source tree is clean"

      - name: Install KernelSU
        if: env.KSU_VARIANT != 'none'
        run: bash scripts/kernelsu.sh

      - name: Apply kernel patches
        run: bash scripts/patches.sh all

      - name: Set up ccache
        if: env.ENABLE_CCACHE == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ env.DEVICE }}-${{ env.KSU_VARIANT }}-${{ env.KERNEL_VERSION }}
          max-size: 2G

      - name: Show build resources
        run: |
          # 之前降到 -j2 是为了防 OOM，但代价是可能撞 120 分钟超时。
          # 现在 job 上限已放到 300 分钟、swap 已有 8G，恢复全核并行。
          echo "--- make -j 调用点 ---"
          grep -n 'make -j' scripts/build.sh || true
          echo "--- CPU / 内存 / 磁盘 ---"
          nproc --all
          free -h
          df -h / /mnt | tail -3

      - name: Build kernel
        run: |
          set -o pipefail
          echo ">>> WORKSPACE=$WORKSPACE"
          cd "$WORKSPACE/android-kernel" || { echo ">>> 致命: cd 失败"; exit 1; }
          echo ">>> PWD=$(pwd)"
          F=drivers/dma/mediatek/mtk-uart-apdma.c
          ls -l "$F" || { echo ">>> 致命: 文件不存在 $(pwd)/$F"; exit 1; }
          # 上游 2025-11 已把 VFF_4G_SUPPORT 正式改名为 VFF_ADDR2（同一寄存器 0x54）。
          # 本树只改了一半：定义了 VFF_ADDR2，代码里还残留 3 处旧名。
          echo ">>> 替换前 VFF_4G_SUPPORT: $(grep -c VFF_4G_SUPPORT "$F" || true)"
          sed -i 's/VFF_4G_SUPPORT_CLR_B/0/g' "$F"
          sed -i 's/VFF_4G_SUPPORT/VFF_ADDR2/g' "$F"
          LEFT=$(grep -c VFF_4G_SUPPORT "$F" || true)
          echo ">>> 替换后残留: $LEFT"
          if [ "$LEFT" != "0" ]; then echo ">>> 致命: 替换失败"; exit 1; fi
          echo ">>> 改后的三处:"
          grep -n 'VFF_ADDR2' "$F"
          # Kbuild 的 KBUILD_CFLAGS += -Werror 追加在 KCFLAGS 之后，
          # 会把传进去的 -Wno-error 覆盖掉，只能在 Makefile 层面摘掉。
          echo ">>> 顶层 Makefile 里的 Werror 行:"
          grep -nE '\-Werror' Makefile | head -12
          # 全部替换成 -Wno-error。
          # 第 1040 行是 $(call cc-option,-Werror,-Wincompatible-pointer-types)，
          # 展开后是全局 -Werror，且后面跟的是逗号，之前的宽匹配漏掉了它。
          # -Wno-error 覆盖全局，-Wno-error=xxx 覆盖单项，语义都对。
          sed -i 's/-Werror/-Wno-error/g' Makefile
          echo ">>> 替换后仍含 -Werror 的行（应为空）:"
          grep -nE '(^|[^-])-Werror' Makefile | head -5 || echo "(none)"
          echo ">>> 确认 -Wno-error 已就位:"
          grep -c -- '-Wno-error' Makefile || true
          # 兜底：直接修源码里的空参数函数（() -> (void)）
          # 文件名用通配符匹配，不靠肉眼读：实际叫 panel-l11-... / panel-l11a-...
          echo ">>> 匹配到的 panel 文件:"
          ls -1 drivers/gpu/drm/panel/panel-*11*-38-0a-0a-dsc-cmd.c 2>/dev/null || echo "(none)"
          for P in drivers/gpu/drm/panel/panel-*11*-38-0a-0a-dsc-cmd.c; do
            [ -f "$P" ] || continue
            BEFORE=$(grep -cE '^static [a-zA-Z_][a-zA-Z0-9_]*[[:space:]]+[a-zA-Z_][a-zA-Z0-9_]*\(\)$' "$P" || true)
            echo ">>> $P 空参数函数数量: $BEFORE"
            grep -nE '^static [a-zA-Z_][a-zA-Z0-9_]*[[:space:]]+[a-zA-Z_][a-zA-Z0-9_]*\(\)$' "$P" || true
            sed -i -E 's/^static ([a-zA-Z_][a-zA-Z0-9_]*[[:space:]]+)([a-zA-Z_][a-zA-Z0-9_]*)\(\)$/static \1\2(void)/' "$P"
            AFTER=$(grep -cE '^static [a-zA-Z_][a-zA-Z0-9_]*[[:space:]]+[a-zA-Z_][a-zA-Z0-9_]*\(\)$' "$P" || true)
            echo ">>> 修完后剩余: $AFTER"
            grep -n '(void)' "$P" | head -4 || true
          done
          # ---------- 全局清掉 -Werror ----------
          # 这棵树到处是 MTK 老代码，-Werror 把每个警告都变成中断点。
          # 统一替换成 -Wno-error（-Wno-error 覆盖全局，-Wno-error=xxx 覆盖单项）。
          echo ">>> 扫描含 -Werror 的构建文件"
          FILES=$(timeout 240 grep -rl --include=Makefile --include='*.mk' --include=Kbuild -e '-Werror' \
                    drivers arch scripts block crypto fs ipc kernel lib mm net security sound virt 2>/dev/null || true)
          echo ">>> 命中文件数: $(printf '%s\n' "$FILES" | grep -c . || echo 0)"
          printf '%s\n' "$FILES" | head -12
          printf '%s\n' "$FILES" | while IFS= read -r f; do
            [ -n "$f" ] || continue
            sed -i 's/-Werror/-Wno-error/g' "$f"
          done
          echo ">>> 清理后残留（应仅剩 -Wno-error）:"
          grep -rn --include=Makefile --include=Kbuild -E '(^|[^-])-Werror' drivers arch 2>/dev/null | head -5 || echo "(clean)"
          cd "$GITHUB_WORKSPACE"
          bash scripts/build.sh all 2>&1 | tee "$RUNNER_TEMP/build_full.log"

      - name: Report build errors
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build_full.log"
          if [ ! -f "$LOG" ]; then echo "no build log captured"; exit 0; fi
          echo "########## 错误摘要 ##########"
          grep -nE "error:|ERROR:|Error [0-9]+|undefined reference|undefined symbol|No space left|No such file|cannot find|Killed|fatal error|internal compiler" "$LOG" | head -60 || echo "(no keyword matched)"
          echo "########## Makefile 里的 Werror 行 ##########"
          grep -n 'Werror' "$WORKSPACE/android-kernel/Makefile" | head -10 || echo "(Makefile 里没有 Werror)"
          echo "########## out/.config 的 WERROR / FRAME_WARN ##########"
          grep -iE 'CONFIG_WERROR|CONFIG_FRAME_WARN' "$WORKSPACE/android-kernel/out/.config" 2>/dev/null || echo "(读不到 .config)"
          echo "########## 编译命令行里的 -Werror ##########"
          grep -o -- '-Werror[^ ]*' "$LOG" | sort | uniq -c | sort -rn | head -10 || echo "(日志里没有 -Werror)"
          echo "########## 末尾 80 行 ##########"
          tail -80 "$LOG"

      - name: Package artifacts
        run: bash scripts/package.sh all

      - name: Upload build metadata files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-meta-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: |
            kernel_workspace/android-kernel/out/Module.symvers
            kernel_workspace/android-kernel/out/System.map
            kernel_workspace/android-kernel/out/.config
          if-no-files-found: warn
          compression-level: 6

      - name: Export build metadata
        id: meta
        run: |
          {
            echo "device=${DEVICE}"
            echo "build_time=${BUILD_TIME}"
            echo "ksu_name=${KSU_NAME:-none}"
            echo "ksu_version=${KSU_VERSION_LABEL:-}"
            echo "kernel_release=${KERNEL_RELEASE:-}"
            echo "susfs_version=${SUSFS_VERSION:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_IMAGE_NAME }}${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/android-kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }}
          if-no-files-found: error

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/AnyKernel3/*
          if-no-files-found: error

      - name: Upload DTBO image
        if: env.CHECK_DTBO_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dtbo-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/android-kernel/out/arch/${{ env.ARCH }}/boot/dtbo.img

      - name: Upload boot image
        if: env.MAKE_BOOT_IMAGE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: boot${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/boot.img

  # Publishing is a separate job so the build itself runs with a read-only
  # token; only this job gets contents:write, and only when asked for.
  release:
    name: Publish release
    needs: build
    if: inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Package AnyKernel3 as a flashable zip
        run: |
          mkdir -p release
          shopt -s nullglob
          for dir in artifacts/AnyKernel3*/; do
            name=$(basename "${dir%/}")
            (cd "$dir" && zip -qr9 "${GITHUB_WORKSPACE}/release/${name}.zip" .)
            echo "packed ${name}.zip"
          done
          for f in artifacts/*/Image* artifacts/*/boot.img artifacts/*/dtbo.img; do
            [ -f "$f" ] && cp "$f" release/
          done
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ needs.build.outputs.device }}-${{ needs.build.outputs.build_time }}
          name: ${{ needs.build.outputs.device }} · ${{ needs.build.outputs.ksu_name }} · ${{ needs.build.outputs.build_time }}
          body: |
            | | |
            | --- | --- |
            | Device | `${{ needs.build.outputs.device }}` |
            | Kernel | `${{ needs.build.outputs.kernel_release }}` |
            | KernelSU | `${{ needs.build.outputs.ksu_name }}` @ `${{ needs.build.outputs.ksu_version }}` |
            | SUSFS | `${{ needs.build.outputs.susfs_version || 'not applied' }}` |

            Flash the AnyKernel3 zip from a custom recovery.
          files: release/*
